# Algorand MainNet deployment: the pool route and the browser client.
#
#   fly deploy -c fly.mainnet.toml --depot=false --remote-only --ha=false
#
# The application id, its account, the treasury and the verifier are those of
# the MainNet application, deployed 2026-09-17. The image build checks only
# that VITE_APP_ID is not empty. The server refuses to boot on an empty APP_ID,
# APP_ACCOUNT, TREASURY or VERIFIER, and on an APP_ACCOUNT that is not APP_ID's
# application address.
#
# Every value in this file is public: addresses, ids and endpoints. The host
# holds no signing key. POST /pin is off -- the boot guard refuses it on MainNet
# -- so the server refuses to boot if ADMIN_MNEMONIC is set: never set it as a
# secret here.
#
# The challenge tag is stamped at settlement and never reclassified, so check
# the 402 of POST /index against this file before anything settles.
#
# INDEX_AGREEMENT_ID is deliberately absent. It changes with every pool, and it
# is set only as a secret, which restarts the machine without a rebuild:
#
#   fly secrets set INDEX_AGREEMENT_ID=<id> -a earnest-mainnet
#
# Were it in [env], the next deploy would put back whatever id this file
# happened to hold. Unset, POST /index answers 503 no_pool_open.

app = "earnest-mainnet"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

# Compiled into the client bundle at build time. Three must agree with [env]
# below: VITE_NETWORK with NETWORK, VITE_ASSET_ID with USDC_ASA_ID and
# VITE_APP_ID with APP_ID.
[build.args]
  VITE_NETWORK = "algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8="
  VITE_ASSET_ID = "31566704"
  VITE_APP_ID = "3710645149"
  VITE_FACILITATOR_URL = "https://facilitator.goplausible.xyz"
  VITE_RESOURCE_HOST = "https://earnest.lxfoundry.ai"
  VITE_MAX_FILE_BYTES = "16777216"
  VITE_ALGOD_URL = "https://mainnet-api.4160.nodely.dev"
  VITE_INDEXER_URL = "https://mainnet-idx.4160.nodely.dev"
  VITE_IPFS_GATEWAY = "https://ipfs.filebase.io"

[env]
  NETWORK = "algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8="
  USDC_ASA_ID = "31566704"
  APP_ID = "3710645149"
  APP_ACCOUNT = "2IZVDH36QFPIQFKOBKHAN4CREL4K77PXU6HQ5RMOF5E47DPE5XZ37Q772I"
  # Equal to APP_ID. Its appearing in any non-MainNet configuration refuses to
  # boot, which keeps development and production different merchants.
  PRODUCTION_APP_ID = "3710645149"
  # The facilitator's fee payer, as its /supported endpoint lists it.
  FEE_PAYER = "ZMFK2OI7ZBD2U27ISERZC4S6LKM6WMFJPZQ4MYNJDZ2VNBNMBA67RA22AA"
  # Must be opted in to USDC 31566704: a create refuses a beneficiary that
  # cannot receive it.
  TREASURY = "BQSHLIQVVZFXUA5RY56N23AVELKHM5IX7C55CKPWS3OE6PSEJSAFEQHYPI"
  # A different key from the admin that creates pools.
  VERIFIER = "AQMCO22S5CUN6LWRBQTIL3XUFXXXG2W6TUQDOPUK25YXYE7L5Y43CIBKMQ"
  PUBLIC_HOST = "https://earnest.lxfoundry.ai"
  ALGOD_URL = "https://mainnet-api.4160.nodely.dev"
  FACILITATOR_URL = "https://facilitator.goplausible.xyz"
  INDEX_SEATS = "5"
  INDEX_SHARE_PRICE_MICRO = "5000000"
  PIN_ROUTE_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  # A buyer's wallet round trip must not land on a machine that is still
  # starting, and one that sleeps on idle is unreachable to anything probing it.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    # Boot reads the application account from algod before it answers.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
