[pytest]
testpaths = tests
# api/ is imported as a package from the repository root; nothing is pip-installed.
pythonpath = .
# The spike runbooks in tests/ are scripts rather than tests. They are named
# *_join_group.py, which the default python_files pattern does not collect, so
# they stay runnable by hand without being swept into the suite.
addopts = -q --strict-markers
asyncio_mode = auto
markers =
    localnet: requires a running LocalNet (algokit localnet start)
    docker: builds a small stage with the local Docker daemon, pulling no
        image. Skipped where no daemon is reachable, except in CI.
    testnet: the TestNet circuit test -- real settlements, real money,
        real elapsed time. Run by hand before merging; never in CI. Two
        gates, and the marker is one of them: the suite skips itself when
        .env carries no E2E_ENABLED, and tests/e2e/conftest.py skips it
        again unless `testnet` is named in -m.
